architectury {
    common(rootProject.enabled_platforms.split(","))
}

def mcVersion = rootProject.minecraft_version
def unobfuscated = rootProject.findProperty("unobfuscated") == "true"

if (unobfuscated) {
    sourceSets.main.java.setSrcDirs(["src/main/javaMojmap26"])
    if (rootProject.minecraft_version == "26.3") {
        sourceSets.main.java.srcDir("src/main/javaMojmap26_3util")
    } else {
        sourceSets.main.java.srcDir("src/main/javaMojmap26_util")
    }
} else {
    def mcPatch = mcVersion.startsWith("1.21.") ? mcVersion.split("\\.")[2].toInteger() : 99
    if (mcPatch >= 11) {
        sourceSets.main.java.srcDir "src/main/java11plus"
        sourceSets.main.java.srcDir "src/main/java9plus"
    } else if (mcPatch >= 9) {
        sourceSets.main.java.srcDir "src/main/java9plus"
        sourceSets.main.java.srcDir "src/main/javaCommandLegacy"
    } else {
        sourceSets.main.java.srcDir "src/main/java8legacy"
        sourceSets.main.java.srcDir "src/main/javaCommandLegacy"
    }
}

dependencies {
    if (unobfuscated) {
        compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        modCompileOnly "dev.architectury:architectury:$rootProject.architectury_api_version"
    }

    if (!unobfuscated) {
        def injectablesVer = "1.0.13"
        compileOnly "dev.architectury:architectury-injectables:$injectablesVer"
        annotationProcessor "dev.architectury:architectury-injectables:$injectablesVer"
    }

    implementation "com.google.code.gson:gson:2.11.0"
}
