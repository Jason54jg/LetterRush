plugins {
    id "com.gradleup.shadow" version "9.5.1"
}

def unobfuscated = rootProject.findProperty("unobfuscated") == "true"

if (unobfuscated) {
    sourceSets.main.java.setSrcDirs(["src/main/javaMojmap26"])
    // Unobfuscated metadata first. Do NOT SourceDirectorySet.exclude the toml:
    // that pattern applies to every srcDir and drops the Mojmap copy too.
    sourceSets.main.resources.setSrcDirs([
        "src/unobfuscated/resources",
        "src/main/resources"
    ])
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    enableModProvidedJavadoc.set(false)
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    if (!unobfuscated) {
        modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    }

    if (unobfuscated) {
        common(project(":common")) { transitive false }
        shadowBundle(project(path: ":common", configuration: "runtimeElements")) { transitive = false }
    } else {
        common(project(path: ":common", configuration: "namedElements")) { transitive false }
        shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
    }
}

processResources {
    if (unobfuscated) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    def displayVersion = "${rootProject.mod_version}+mc${rootProject.minecraft_version}"
    inputs.property "version", displayVersion
    inputs.property "neoforge_minecraft_range", rootProject.findProperty("neoforge_minecraft_range") ?: "[1.21.1,1.21.6)"
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": displayVersion, "minecraft_range": neoforge_minecraft_range
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = unobfuscated ? "" : "dev-shadow"
}

if (unobfuscated) {
    tasks.register("remapJar") {
        dependsOn(tasks.named("shadowJar"))
        group = "build"
        description = "Production jar (unobfuscated; alias for shadowJar)"
    }
} else {
    remapJar {
        inputFile.set shadowJar.archiveFile
        dependsOn shadowJar
    }
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
