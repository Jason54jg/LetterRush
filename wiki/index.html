<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LetterRush — Docs</title>
  <meta name="description" content="LetterRush documentation: installation, gameplay, commands, configuration." />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" href="https://raw.githubusercontent.com/Jason54jg/LetterRush/main/common/src/main/resources/assets/letterrush/icon.png" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" />
  <style>
    :root {
      --theme-color: #3ecf8e;
      --letter-bg: #0d1117;
      --letter-panel: #161b22;
      --letter-border: #30363d;
      --letter-muted: #8b949e;
    }

    html, body {
      background: var(--letter-bg);
    }

    .sidebar {
      background: var(--letter-panel) !important;
      border-right: 1px solid var(--letter-border);
    }

    .sidebar ul li a {
      color: #c9d1d9;
    }

    .sidebar ul li.active > a {
      color: var(--theme-color);
      border-right: 2px solid var(--theme-color);
    }

    .markdown-section {
      color: #e6edf3;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      color: #f0f6fc;
      border-bottom-color: var(--letter-border);
    }

    .markdown-section a {
      color: var(--theme-color);
    }

    .markdown-section code,
    .markdown-section pre {
      background: #0a0e14 !important;
      border: 1px solid var(--letter-border);
    }

    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
    }

    .markdown-section tr {
      border-top: 1px solid var(--letter-border);
    }

    .markdown-section th,
    .markdown-section td {
      border: 1px solid var(--letter-border);
      background: var(--letter-panel);
    }

    .markdown-section img {
      border-radius: 8px;
      max-width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    /* Cover — full-bleed dark hero */
    section.cover {
      background: radial-gradient(ellipse at 50% 0%, #1a3d2e 0%, #0d1117 55%, #050608 100%) !important;
      color: #f0f6fc;
    }

    section.cover .cover-main {
      max-width: 720px;
    }

    section.cover .cover-main > img {
      max-width: 160px;
      margin-bottom: 1rem;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.55));
    }

    section.cover h1 {
      font-size: 2.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    section.cover h1 small {
      font-size: 0.45em;
      color: var(--letter-muted);
      font-weight: 500;
    }

    section.cover blockquote {
      font-size: 1.15rem;
      color: #c9d1d9;
      border: none;
    }

    section.cover .cover-main > p:last-child a {
      border-radius: 6px;
      border: 1px solid var(--letter-border);
      background: transparent;
      color: #e6edf3 !important;
      padding: 0.65rem 1.25rem;
      margin: 0.35rem;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    section.cover .cover-main > p:last-child a:first-child {
      background: var(--theme-color);
      border-color: var(--theme-color);
      color: #0d1117 !important;
      font-weight: 600;
    }

    section.cover .cover-main > p:last-child a:hover {
      border-color: var(--theme-color);
    }

    .app-name-link {
      color: #f0f6fc !important;
      font-weight: 600;
    }

    .search input {
      background: var(--letter-bg) !important;
      border: 1px solid var(--letter-border) !important;
      color: #e6edf3 !important;
    }

    .search .matching-post {
      border-bottom-color: var(--letter-border);
    }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'LetterRush',
      nameLink: '#/',
      repo: 'https://github.com/Jason54jg/LetterRush',
      homepage: 'Home.md',
      coverpage: true,
      onlyCover: false,
      loadSidebar: true,
      loadFooter: true,
      auto2top: true,
      relativePath: true,
      subMaxLevel: 2,
      search: {
        placeholder: 'Search…',
        noData: 'No results',
        paths: 'auto'
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
