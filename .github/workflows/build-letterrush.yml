name: Build LetterRush

on:
  push:
    branches: [cursor/letterrush-mod-6a3f, main]
    paths:
      - 'common/**'
      - 'fabric/**'
      - 'neoforge/**'
      - 'gradle/**'
      - 'scripts/build-all-versions.sh'
      - 'build.gradle'
      - 'settings.gradle'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.21.1'
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Gradle for ${{ matrix.minecraft }}
        run: cat gradle/versions/common.properties gradle/versions/${{ matrix.minecraft }}.properties > gradle.properties
      - name: Build jars
        run: |
          if grep -q '^skip_neoforge=true' gradle.properties; then
            ./gradlew --no-daemon :fabric:remapJar
          else
            ./gradlew --no-daemon :fabric:remapJar :neoforge:remapJar
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: letterrush-${{ matrix.minecraft }}
          path: |
            fabric/build/libs/letterrush-*+fabric.jar
            neoforge/build/libs/letterrush-*+neoforge.jar
