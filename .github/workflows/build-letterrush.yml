name: Build LetterRush

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'common/**'
      - 'fabric/**'
      - 'neoforge/**'
      - 'gradle/**'
      - 'scripts/build-all-versions.sh'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-letterrush.yml'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: '1.21.11', java: '21' }
          - { minecraft: '26.1.2', java: '25' }
          - { minecraft: '26.2', java: '25' }
          - { minecraft: '26.3', java: '25' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Configure Gradle for ${{ matrix.minecraft }} (Java ${{ matrix.java }})
        run: cat gradle/versions/common.properties gradle/versions/${{ matrix.minecraft }}.properties > gradle.properties
      - name: Build jars
        run: |
          if grep -q '^skip_neoforge=true' gradle.properties; then
            ./gradlew --no-daemon :fabric:remapJar
          else
            ./gradlew --no-daemon :fabric:remapJar :neoforge:remapJar
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: letterrush-${{ matrix.minecraft }}
          path: |
            fabric/build/libs/letterrush-*+fabric.jar
            neoforge/build/libs/letterrush-*+neoforge.jar
          if-no-files-found: warn
